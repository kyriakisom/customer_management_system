apiVersion: v1               # Core Kubernetes API version for Service resources
kind: Service                # Service resource exposes a set of Pods as a network service

metadata:
  name: customer-api         # Name of the Service resource

spec:
  type: NodePort             # Exposes the service on each Node's IP at a static port (NodePort)
                             # This allows external traffic to access the service using <NodeIP>:<NodePort>

  selector:
    app: customer-api        # Selects pods with label 'app: customer-api' to route traffic to

  ports:
    - port: 80               # Port the service exposes internally within the cluster
      targetPort: 80         # Port on the Pod/container that receives the traffic
      nodePort: 30080        # Port exposed on each Node to access this service externally
