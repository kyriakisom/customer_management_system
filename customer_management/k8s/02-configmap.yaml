apiVersion: v1  # Kubernetes API version for core resources like ConfigMap
kind: ConfigMap  # Resource type: ConfigMap (used to store non-sensitive configuration data)

metadata:
  name: api-config  # Name of the ConfigMap resource

data:
  # Database name used by your application
  MONGO_DB_NAME: customerdb

  # MongoDB connection string used by your app to connect to the MongoDB service in the cluster
  # Includes username (admin), password (secret123), and the fully qualified domain name of the mongo service (headless)
  MONGO_CONNECTION_STRING: mongodb://admin:secret123@mongo-0.mongo-headless.default.svc.cluster.local:27017
