apiVersion: v1  # Kubernetes API version for core resources like Secret
kind: Secret   # Resource type: Secret (used to store sensitive data)

metadata:
  name: mongo-secret  # Name of the Secret resource

type: Opaque  # Secret type; Opaque means arbitrary user-defined key-value pairs

stringData:
  MONGO_USER: admin         # Username for MongoDB, stored as plain text here
  MONGO_PASSWORD: secret123 # Password for MongoDB, stored as plain text here
